# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 顶层最小权限:默认只读,单个 job 如需更多权限再自行声明(收紧 GITHUB_TOKEN 攻击面)
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: internal/go.mod
          cache: true
          cache-dependency-path: internal/go.sum

      - name: Verify go.mod/ go.sum in sync
        run: go -C internal mod verify

      - name: Test
        run: go -C internal test ./... -count=1

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: internal/go.mod
          cache: true
          cache-dependency-path: internal/go.sum

      - name: go vet
        run: go -C internal vet ./...

      - name: gofmt check
        continue-on-error: true
        run: gofmt -l $(find internal -name '*.go')

  dependency-scan:
    name: Dependency Vuln Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: internal/go.mod
          cache: true
          cache-dependency-path: internal/go.sum

      - name: Run govulncheck
        run: go -C internal run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
