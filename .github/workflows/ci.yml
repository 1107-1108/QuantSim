# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: true

      - name: Verify go.mod/ go.sum in sync
        run: go -C internal mod verify

      - name: Test
        run: go -C internal test ./... -count=1

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true

      - name: go vet
        run: go -C internal vet ./...

      - name: gofmt check
        continue-on-error: true
        run: gofmt -l $(find internal -name '*.go')

  dependency-scan:
    name: Dependency Vuln Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true

      - name: Run govulncheck
        run: go -C internal run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}