version: 2
updates:
  # Go modules under internal/
  - package-ecosystem: "gomod"
    directory: "/internal"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5